<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Six Principles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttnNavy: '#0C2340',
                        ttnTrustBlue: '#005EB8',
                        ttnActionOrange: '#FE5000',
                        ttnSlate: '#333F48',
                        ttnIceBlue: '#DBE2E9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-transparent m-0 p-4 md:p-8 font-sans text-ttnSlate antialiased w-full h-screen overflow-hidden flex flex-col">

    <div class="w-full max-w-7xl mx-auto flex flex-col h-full">
        
        <!-- Header Section -->
        <div class="text-center mb-8 shrink-0">
            <h2 class="text-3xl font-bold text-ttnNavy tracking-tight mb-3">The Six Principles</h2>
            <p class="text-base text-slate-600 max-w-2xl mx-auto">Briefly. These sit underneath everything that follows. You'll feel them at work in the skills on the next few pages. <span class="text-ttnTrustBlue font-semibold">Select a principle to explore.</span></p>
        </div>

        <!-- Interactive Area -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 flex-grow min-h-0 pb-4">
            
            <!-- Left Column: The 6 Buttons -->
            <div class="md:col-span-5 flex flex-col gap-4 h-full">
                <button onclick="showPrinciple(1)" id="btn-1" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">1</span>
                    <span class="font-semibold text-ttnNavy text-lg">Express Empathy</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                
                <button onclick="showPrinciple(2)" id="btn-2" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">2</span>
                    <span class="font-semibold text-ttnNavy text-lg">Develop Discrepancy</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <button onclick="showPrinciple(3)" id="btn-3" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">3</span>
                    <span class="font-semibold text-ttnNavy text-lg">Avoid Argument</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <button onclick="showPrinciple(4)" id="btn-4" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">4</span>
                    <span class="font-semibold text-ttnNavy text-lg">Roll with Resistance</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <button onclick="showPrinciple(5)" id="btn-5" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">5</span>
                    <span class="font-semibold text-ttnNavy text-lg">Support Self-Efficacy</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <button onclick="showPrinciple(6)" id="btn-6" class="flex-1 flex items-center p-4 rounded-xl border-2 border-slate-200 hover:border-ttnTrustBlue bg-white transition-all group">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-blue-100 group-hover:text-ttnTrustBlue transition-colors">6</span>
                    <span class="font-semibold text-ttnNavy text-lg">Assess Confidence</span>
                    <svg class="w-5 h-5 ml-auto text-slate-400 group-hover:text-ttnTrustBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Right Column: Detail Display Panel -->
            <div class="md:col-span-7 h-full">
                <!-- Added relative positioning, background white base, and hidden overflow -->
                <div id="displayPanel" class="relative w-full h-full bg-white border-2 border-slate-100 rounded-2xl flex flex-col items-center justify-center p-12 text-center transition-all duration-300 shadow-inner overflow-hidden">
                    
                    <!-- TTN Watermark Layer -->
                    <div class="absolute inset-0 z-0 bg-[url('Watermark_Background.jpeg')] bg-cover bg-center opacity-20 pointer-events-none"></div>

                    <!-- Default Idle State (z-10 to stay above watermark) -->
                    <div id="idleState" class="relative z-10 flex flex-col items-center opacity-100 transition-opacity duration-300">
                        <svg class="w-16 h-16 text-slate-400 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
                        </svg>
                        <p class="text-lg font-medium text-slate-500">Select a principle on the left to view details.</p>
                    </div>

                    <!-- Active Content State (z-10 to stay above watermark) -->
                    <div id="activeState" class="relative z-10 hidden flex-col items-center justify-center h-full w-full">
                        <h3 id="principleTitle" class="text-3xl font-bold text-ttnNavy mb-6 drop-shadow-sm"></h3>
                        <p id="principleText" class="text-xl leading-relaxed text-slate-800 font-medium drop-shadow-sm"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="audio-1" src="vo_principle_1.wav"></audio>
    <audio id="audio-2" src="vo_principle_2.wav"></audio>
    <audio id="audio-3" src="vo_principle_3.wav"></audio>
    <audio id="audio-4" src="vo_principle_4.wav"></audio>
    <audio id="audio-5" src="vo_principle_5.wav"></audio>
    <audio id="audio-6" src="vo_principle_6.wav"></audio>

    <script>
        const principles = {
            1: { title: "Express Empathy", text: "See the world through your patient's eyes. Without judging it." },
            2: { title: "Develop Discrepancy", text: "Help your patient notice the gap between where they are and where they want to be." },
            3: { title: "Avoid Argument", text: "Arguing for change invites arguing against it. Every time." },
            4: { title: "Roll with Resistance", text: "Resistance isn't a wall to push through. It's a signal to shift your approach." },
            5: { title: "Support Self-Efficacy", text: "Your patient needs to believe change is possible for them, specifically." },
            6: { title: "Assess Confidence", text: "Wanting to change and believing you can are two different questions. Ask both." }
        };

        let currentAudio = null;

        function showPrinciple(id) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            for (let i = 1; i <= 6; i++) {
                const btn = document.getElementById(`btn-${i}`);
                const numberCircle = btn.querySelector('span:first-child');
                
                btn.classList.remove('border-ttnTrustBlue', 'bg-blue-50');
                btn.classList.add('border-slate-200', 'bg-white');
                
                numberCircle.classList.remove('bg-ttnTrustBlue', 'text-white');
                numberCircle.classList.add('bg-slate-100', 'text-slate-500');
            }

            const activeBtn = document.getElementById(`btn-${id}`);
            const activeCircle = activeBtn.querySelector('span:first-child');
            
            activeBtn.classList.remove('border-slate-200', 'bg-white');
            activeBtn.classList.add('border-ttnTrustBlue', 'bg-blue-50');
            
            activeCircle.classList.remove('bg-slate-100', 'text-slate-500');
            activeCircle.classList.add('bg-ttnTrustBlue', 'text-white');

            document.getElementById('idleState').classList.add('hidden');
            document.getElementById('activeState').classList.remove('hidden');
            document.getElementById('activeState').classList.add('flex');
            
            document.getElementById('principleTitle').textContent = principles[id].title;
            document.getElementById('principleText').textContent = principles[id].text;

            currentAudio = document.getElementById(`audio-${id}`);
            if (currentAudio) {
                currentAudio.play().catch(e => console.log("Audio playback requires user interaction."));
            }
        }
    </script>
</body>
</html>
